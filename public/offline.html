<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161f" />
    <title>Offline · CountBook</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161f;
        --fg: #ece9e2;
        --muted: #9a9cab;
        --amber: #f5b53d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(circle at 50% 20%, rgba(245, 181, 61, 0.12), transparent 60%), var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 10px 40px -10px rgba(245, 181, 61, 0.5); }
      h1 { font-size: 1.35rem; margin: 20px 0 8px; letter-spacing: -0.01em; }
      p { margin: 0 auto; max-width: 300px; color: var(--muted); line-height: 1.5; font-size: 0.95rem; }
      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        background: var(--amber);
        color: #2a1a02;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>CountBook needs a connection to load live stock and sales. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
